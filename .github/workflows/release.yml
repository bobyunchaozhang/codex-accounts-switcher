name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Check native architecture
        run: test "$(uname -m)" = '${{ matrix.arch }}'
      - name: Test core
        working-directory: 产品
        run: swift test --filter AccountCoreTests
      - name: Build and package
        run: zsh 产品/scripts/package-release.sh '${{ matrix.arch }}'
      - name: Smoke-test app resources without accounts
        run: |
          mkdir -p "$RUNNER_TEMP/preview"
          '产品/dist/${{ matrix.arch }}/Codex Accounts.app/Contents/MacOS/CodexAccounts' --render-previews "$RUNNER_TEMP/preview"
          test -s "$RUNNER_TEMP/preview/accounts.png"
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish both downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "Codex Accounts $RELEASE_TAG" --notes-file RELEASE_NOTES.md
